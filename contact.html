<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - ConvertX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <a class="logo" href="index.html">Convert<span>X</span></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="privacy.html">Privacy</a>
    <a href="contact.html">Contact</a>
    <button id="themeToggle" class="theme-btn" title="Toggle Dark/Light Mode">🌙</button>
  </nav>
</header>

<main class="page-content">
  <h1>Contact Us</h1>
  <p>Have a question, feature request, or found a bug? Send us a message below.</p>

  <form class="contact-form" onsubmit="event.preventDefault(); document.getElementById('formStatus').style.display='block'; this.reset();">
    <label for="name">Your Name</label>
    <input type="text" id="name" placeholder="Enter your name" required>

    <label for="email">Your Email</label>
    <input type="email" id="email" placeholder="Enter your email" required>

    <label for="message">Message</label>
    <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>

    <button type="submit" class="primary-btn">Send Message</button>
    <p id="formStatus" style="display:none; color:#16a34a; font-weight:600; margin-top:10px;">
      Thank you! Your message has been received.
    </p>
  </form>
</main>

<footer>
  <p>© 2026 ConvertX. All rights reserved.</p>
  <p><a href="index.html">Home</a> | <a href="about.html">About</a> | <a href="privacy.html">Privacy Policy</a> | <a href="contact.html">Contact</a></p>
</footer>

<script>
  const themeToggle = document.getElementById("themeToggle");
  if (localStorage.getItem("convertx-theme") === "dark") {
    document.body.classList.add("dark-mode");
    themeToggle.textContent = "☀️";
  }
  themeToggle.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");
    const isDark = document.body.classList.contains("dark-mode");
    themeToggle.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("convertx-theme", isDark ? "dark" : "light");
  });
</script>
</body>
</html>
